name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm binutils qemu-user wine64

      - name: Build the compiler
        run: make

      - name: Test (Linux x86-64)
        run: make test

      - name: Test (every target: Windows via Wine, ARM64 / Android via QEMU)
        run: make test-all

      - name: Compile all examples for all targets
        run: make examples

      - name: Package
        run: |
          make dist
          make deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a-lang-release
          path: |
            dist/ac-*-release.elf
            dist/a-*-release.deb
