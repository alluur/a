<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A display</title>
<style>
html, body { margin: 0; height: 100%; background: #10141c; overflow: hidden; font-family: sans-serif; }
#wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
canvas { cursor: none; outline: none; image-rendering: auto; max-width: 100%; max-height: 100%; background: #000; }
#status { position: fixed; left: 12px; bottom: 10px; padding: 4px 10px; border-radius: 6px; background: #0008; color: #fff; font-size: 13px; display: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" tabindex="0"></canvas></div>
<div id="status"></div>
<script>
(function () {
  var token = "@TOKEN@";
  var cv = document.getElementById("c"), cx = cv.getContext("2d");
  var st = document.getElementById("status");
  var ws = null, W = 0, H = 0, retry = null;
  var named = { Enter: 13, Backspace: 8, Tab: 9, Escape: 27, Delete: 127, ArrowLeft: 300, ArrowRight: 301, ArrowUp: 302, ArrowDown: 303,
                Home: 304, End: 305, PageUp: 306, PageDown: 307, Insert: 308, Shift: 340, Control: 341, Alt: 342, Meta: 343, CapsLock: 344 };
  for (var i = 1; i <= 12; i++) { named["F" + i] = 319 + i; }

  function status(t) { st.textContent = t; st.style.display = t ? "block" : "none"; }

  function connect() {
    var url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?t=" + encodeURIComponent(token);
    ws = new WebSocket(url);
    ws.binaryType = "arraybuffer";
    ws.onopen = function () { status(""); cv.focus(); };
    ws.onmessage = function (e) {
      var d = new DataView(e.data), t = d.getUint8(0);
      if (t === 1) { W = d.getUint16(1); H = d.getUint16(3); cv.width = W; cv.height = H; }
      else if (t === 2) { rect(d); }
    };
    ws.onclose = function () { status("disconnected, trying again"); clearTimeout(retry); retry = setTimeout(connect, 1500); };
  }

  function rect(d) {
    var x = d.getUint16(1), y = d.getUint16(3), w = d.getUint16(5), h = d.getUint16(7);
    var im = cx.createImageData(w, h), o = im.data, p = 9, n = w * h, i = 0, len = d.byteLength, q, j, k;
    while (i < n && p < len) {
      var c = d.getUint8(p++);
      if (c < 128) {
        k = c + 1;
        for (j = 0; j < k && i < n; j++) { q = i * 4; o[q] = d.getUint8(p); o[q + 1] = d.getUint8(p + 1); o[q + 2] = d.getUint8(p + 2); o[q + 3] = 255; p += 3; i++; }
      } else {
        k = c - 125;
        var r = d.getUint8(p), g = d.getUint8(p + 1), b = d.getUint8(p + 2);
        p += 3;
        for (j = 0; j < k && i < n; j++) { q = i * 4; o[q] = r; o[q + 1] = g; o[q + 2] = b; o[q + 3] = 255; i++; }
      }
    }
    cx.putImageData(im, x, y);
  }

  function send(bytes) { if (ws && ws.readyState === 1) { ws.send(new Uint8Array(bytes)); } }
  function u16(v) { return [(v >> 8) & 255, v & 255]; }
  function pos(e) {
    var r = cv.getBoundingClientRect();
    var x = Math.round((e.clientX - r.left) * W / r.width), y = Math.round((e.clientY - r.top) * H / r.height);
    return [Math.max(0, Math.min(W - 1, x)), Math.max(0, Math.min(H - 1, y))];
  }
  function button(e) { return e.button === 0 ? 1 : (e.button === 1 ? 2 : 3); }

  cv.addEventListener("mousemove", function (e) { var p = pos(e); send([1].concat(u16(p[0]), u16(p[1]))); });
  cv.addEventListener("mousedown", function (e) { var p = pos(e); send([1].concat(u16(p[0]), u16(p[1]))); send([2, button(e)]); cv.focus(); e.preventDefault(); });
  cv.addEventListener("mouseup", function (e) { send([3, button(e)]); e.preventDefault(); });
  cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  cv.addEventListener("wheel", function (e) { send([4, e.deltaY < 0 ? 1 : 255]); e.preventDefault(); }, { passive: false });

  function code(e) {
    var k = e.key;
    if (named[k] !== undefined) { return [named[k], 0]; }
    if (k.length === 0) { return null; }
    var cp = k.codePointAt(0);
    if (k.length > 2 || (k.length === 2 && cp < 65536)) { return null; }       // names such as "Dead" or "Unidentified"
    var lower = k.toLowerCase();
    var key = (lower.length === k.length && lower.codePointAt(0) < 65536) ? lower.codePointAt(0) : cp;
    return [key & 0xFFFF, cp];
  }
  function key(e, down) {
    var c = code(e);
    if (!c) { return; }
    if (down) { send([5].concat(u16(c[0]), [(c[1] >>> 24) & 255, (c[1] >> 16) & 255, (c[1] >> 8) & 255, c[1] & 255])); }
    else { send([6].concat(u16(c[0]))); }
    e.preventDefault();
  }
  cv.addEventListener("keydown", function (e) { key(e, true); });
  cv.addEventListener("keyup", function (e) { key(e, false); });
  cv.addEventListener("blur", function () { [340, 341, 342, 343].forEach(function (k) { send([6].concat(u16(k))); }); });

  connect();
})();
</script>
</body>
</html>
